<style>
/* Layout : bandeau de recherche, puis trois vues (carte + liste latérale / communes / trombinoscope), fiche en panneau superposé */
:root {
  --bg: #F4F7F2; --surface: #FFFFFF; --ink: #15302A; --muted: #587069; --line: #D9E3DB;
  --primary: #0E6E5C; --primary-ink: #FFFFFF; --primary-soft: #DCEEE6;
  --accent: #D98E0F; --accent-soft: #FBEFD6;
  --sea: #D7E9EF; --land: #ECEFE3; --land-edge: #FFFFFF;
  --shadow: 0 1px 2px rgba(21,48,42,.06), 0 8px 24px rgba(21,48,42,.08);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1916; --surface: #15231F; --ink: #E4EEE9; --muted: #9AB0A8; --line: #263A33;
  --primary: #5DC3A6; --primary-ink: #0B1C17; --primary-soft: #1B3A31;
  --accent: #F0B347; --accent-soft: #3A2E17;
  --sea: #0F252C; --land: #1C2C26; --land-edge: #0E1916;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1916; --surface: #15231F; --ink: #E4EEE9; --muted: #9AB0A8; --line: #263A33;
  --primary: #5DC3A6; --primary-ink: #0B1C17; --primary-soft: #1B3A31;
  --accent: #F0B347; --accent-soft: #3A2E17;
  --sea: #0F252C; --land: #1C2C26; --land-edge: #0E1916;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0 }
[hidden] { display: none !important }
img { max-width: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 0 48px }
a { color: var(--primary) }
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px }

header.top { padding-block: 28px 18px; display: grid; gap: 6px }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.proto { background: var(--accent-soft); color: var(--ink); border-radius: 99px; padding: 2px 10px; letter-spacing: .04em }
h1 { font: 400 clamp(28px, 4.4vw, 44px)/1.08 var(--f-display); margin: 0; text-wrap: balance }
.lede { color: var(--muted); margin: 0; max-width: 62ch }
.lede b { color: var(--ink); font-variant-numeric: tabular-nums }

.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 900; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.search { flex: 1 1 260px; min-width: 0; position: relative }
.search input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted) }
select { padding: 10px 32px 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-width: 100%; min-width: 0; flex: 1 1 160px; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%; background-size: 5px 5px; background-repeat: no-repeat }
.chip-toggle { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 99px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 14px }
.chip-toggle[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink) }
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted) }
.tabs button[aria-selected="true"] { background: var(--primary-soft); color: var(--ink) }
.status { font-size: 14px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums }
.reset { border: 0; background: none; color: var(--primary); cursor: pointer; text-decoration: underline; font-size: 14px; padding: 4px }

main { padding-top: 20px }
/* Vue carte */
.mapview { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start }
#map { height: min(72vh, 640px); min-height: 380px; border-radius: var(--r); background: var(--sea); border: 1px solid var(--line); z-index: 1 }
.side { display: grid; gap: 10px; max-height: min(72vh, 640px); overflow: auto; padding-right: 4px; align-content: start }
.side-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; position: sticky; top: 0; background: var(--bg); padding-bottom: 6px; z-index: 1 }
.side-head h2 { font: 400 22px/1.2 var(--f-display); margin: 0 }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px }

.leaflet-container { font-family: var(--f-body); background: var(--sea) }
.pin { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #1E1503; font-weight: 700; font-size: 14px; border: 3px solid var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.25); transition: transform .15s }
.pin.on { background: var(--primary); color: var(--primary-ink); transform: scale(1.18) }
.leaflet-tooltip.lbl { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 600; border-radius: 8px }
.leaflet-tooltip.lbl::before { display: none }
.leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted) }
.leaflet-control-attribution a { color: var(--primary) }
.leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line) }

/* Carte compacte de professionnel */
.card { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; text-align: left; width: 100% }
.card:hover { border-color: var(--primary) }
.card .who { font-weight: 700; line-height: 1.25 }
.card .meta { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.card .pitch { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px }
.avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--primary-soft); display: grid; place-items: center; font: 400 20px var(--f-display); color: var(--primary); flex: none }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px }
.b { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--primary-soft); color: var(--ink); letter-spacing: .01em }
.b.visio { background: var(--accent-soft) }

/* Vue par commune */
.communes { display: grid; gap: 28px }
.commune h2 { font: 400 24px/1.2 var(--f-display); margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px }
.commune h2 span { font: 600 13px var(--f-body); color: var(--muted) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px }

/* Trombinoscope */
.trombi { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 18px }
.face { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; display: grid; gap: 8px }
.face .ph { aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: var(--r); object-fit: cover; background: var(--primary-soft); display: grid; place-items: center; font: 400 44px var(--f-display); color: var(--primary); transition: transform .2s, box-shadow .2s }
.face:hover .ph { transform: translateY(-3px); box-shadow: var(--shadow) }
.face .who { font-weight: 700; line-height: 1.2 }
.face .meta { font-size: 13px; color: var(--muted) }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); background: var(--surface); border-radius: var(--r); border: 1px dashed var(--line) }

/* Fiche */
.overlay { position: fixed; inset: 0; background: rgba(8,20,16,.45); z-index: 2000; display: flex; justify-content: flex-end }
.sheet { background: var(--bg); width: min(680px, 100%); height: 100%; overflow: auto; padding-block: env(safe-area-inset-top, 0px) 40px; box-shadow: var(--shadow); animation: slide .25s ease-out }
@keyframes slide { from { transform: translateX(30px); opacity: .6 } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none } .face .ph, .pin { transition: none } }
.sheet-in { padding-inline: 24px; display: grid; gap: 22px }
.close { position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 12px 12px 0; background: linear-gradient(var(--bg) 70%, transparent); z-index: 2 }
.close button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-weight: 600 }
.id { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: center }
.id .ph { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: var(--primary-soft); display: grid; place-items: center; font: 400 44px var(--f-display); color: var(--primary) }
.id h2 { font: 400 30px/1.1 var(--f-display); margin: 0 0 4px; text-wrap: balance }
.id .struct { color: var(--muted); font-weight: 500 }
.id .where { font-size: 14px; margin-top: 6px }
blockquote { margin: 0; font: 400 18px/1.5 var(--f-display); color: var(--ink); border-left: 3px solid var(--accent); padding: 2px 0 2px 16px; white-space: pre-line }
.contact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px }
.contact .line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.contact .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 72px; font-weight: 600 }
.contact .val { font-weight: 600; user-select: all; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0 }
.copy { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 3px 10px; font-size: 12.5px; cursor: pointer }
.links { display: flex; gap: 8px; flex-wrap: wrap }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px }
.btn.main { background: var(--primary); color: var(--primary-ink); border-color: var(--primary) }
.sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 700 }
.sec h4 { font-size: 14px; margin: 10px 0 6px; font-weight: 600 }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font-size: 13px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface) }
.tag.hit { background: var(--accent-soft); border-color: var(--accent) }
.appr { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)) }
.appr div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
.appr b { display: block } .appr span { font-size: 13px; color: var(--muted) }
.forms { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px }
.rpps { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums }

footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 4px }

@media (max-width: 860px) {
  .mapview { grid-template-columns: minmax(0, 1fr) }
  #map { height: 52vh; min-height: 320px }
  .side { max-height: none; overflow: visible }
  .status { margin-left: 0; width: 100% }
}
@media (max-width: 480px) {
  .wrap { padding-inline: 16px }
  .id { grid-template-columns: 84px minmax(0, 1fr); gap: 14px }
  .id .ph { width: 84px; height: 84px; font-size: 32px }
  .id h2 { font-size: 24px }
  .sheet-in { padding-inline: 16px }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Annuaire des adhérents · 2026</div>
    <h1>Diététiciens libéraux de La Réunion</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="controls">
    <div class="row">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Nom, commune, spécialité (ex. SOPK, diabète, TCA)…" aria-label="Rechercher"></label>
      <select id="f-domaine" aria-label="Domaine d'accompagnement"></select>
      <select id="f-public" aria-label="Public"></select>
      <select id="f-commune" aria-label="Commune"></select>
    </div>
    <div class="row">
      <div class="tabs" role="tablist" aria-label="Affichage">
        <button role="tab" id="t-carte" aria-selected="true" data-v="carte">Carte</button>
        <button role="tab" id="t-communes" aria-selected="false" data-v="communes">Par commune</button>
        <button role="tab" id="t-trombi" aria-selected="false" data-v="trombi">Trombinoscope</button>
      </div>
      <button class="chip-toggle" id="m-Cabinet" aria-pressed="false" data-m="Cabinet">Au cabinet</button>
      <button class="chip-toggle" id="m-Visio" aria-pressed="false" data-m="Visio">En visio</button>
      <button class="chip-toggle" id="m-Domicile" aria-pressed="false" data-m="Domicile">À domicile</button>
      <span class="status"><span id="count"></span> <button class="reset" id="reset" hidden>Tout effacer</button></span>
    </div>
  </div>

  <main>
    <section id="v-carte" class="mapview">
      <div id="map" role="region" aria-label="Carte des communes"></div>
      <div class="side" id="side"></div>
    </section>
    <section id="v-communes" class="communes" hidden></section>
    <section id="v-trombi" class="trombi" hidden></section>
  </main>

  <footer>
    <div>Annuaire 2026. Les informations sont publiées telles que transmises par chaque professionnel, mises à jour une fois par an.</div>
    <div id="attrib">Contours des communes : IGN Admin Express, via geo.api.gouv.fr (Licence Ouverte).</div>
  </footer>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = /*DATA*/;
const GEO = /*GEO*/;
// Centre-bourg de chaque commune (position des pastilles)
const BOURGS = {
  "Saint-Denis": [-20.8823, 55.4504], "Sainte-Marie": [-20.8970, 55.5490], "Sainte-Suzanne": [-20.9065, 55.6070],
  "Saint-André": [-20.9630, 55.6500], "Bras-Panon": [-20.9990, 55.6800], "Saint-Benoît": [-21.0340, 55.7130],
  "La Plaine-des-Palmistes": [-21.1360, 55.6280], "Sainte-Rose": [-21.1280, 55.7950], "Saint-Philippe": [-21.3590, 55.7670],
  "Saint-Joseph": [-21.3780, 55.6190], "Petite-Île": [-21.3540, 55.5650], "Saint-Pierre": [-21.3390, 55.4780],
  "Le Tampon": [-21.2780, 55.5150], "Entre-Deux": [-21.2470, 55.4720], "Saint-Louis": [-21.2860, 55.4110],
  "L'Étang-Salé": [-21.2650, 55.3670], "Les Avirons": [-21.2410, 55.3390], "Saint-Leu": [-21.1710, 55.2880],
  "Les Trois-Bassins": [-21.1050, 55.2980], "Saint-Paul": [-21.0100, 55.2700], "Le Port": [-20.9370, 55.2930],
  "La Possession": [-20.9250, 55.3360], "Salazie": [-21.0280, 55.5390], "Cilaos": [-21.1340, 55.4710]
};
const P = DATA.pros;
const byId = Object.fromEntries(P.map(p => [p.id, p]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tagsOf = p => Object.values(p.domaines).flat();
const fullName = p => `${p.prenom} ${p.nom}`;
P.forEach(p => p._txt = norm([fullName(p), p.structure, p.communes.join(" "), tagsOf(p).join(" "), p.publics.join(" "), p.approches.join(" "), p.pitch].join(" ")));

const st = { q: "", domaine: "", public: "", commune: "", modes: new Set(), view: "carte" };
try { const v = localStorage.getItem("annuaire-vue"); if (v) st.view = v } catch (e) {}

function matches(p, ignoreCommune) {
  if (st.q && !norm(st.q).split(/\s+/).every(w => p._txt.includes(w))) return false;
  if (st.domaine && !tagsOf(p).includes(st.domaine)) return false;
  if (st.public && !p.publics.includes(st.public)) return false;
  if (!ignoreCommune && st.commune && !p.communes.includes(st.commune)) return false;
  for (const m of st.modes) if (!p.modalites.includes(m)) return false;
  return true;
}

// --- Filtres ---
function fillSelects() {
  const dom = document.getElementById("f-domaine");
  let h = `<option value="">Tous les domaines</option>`;
  for (const cat of DATA.categories) {
    const counts = {};
    P.forEach(p => (p.domaines[cat] || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
    const keys = Object.keys(counts).sort((a, b) => a.localeCompare(b, "fr"));
    if (!keys.length) continue;
    h += `<optgroup label="${esc(cat)}">` + keys.map(k => `<option value="${esc(k)}">${esc(k)} (${counts[k]})</option>`).join("") + `</optgroup>`;
  }
  dom.innerHTML = h;
  const pubs = {}; P.forEach(p => p.publics.forEach(t => pubs[t] = (pubs[t] || 0) + 1));
  document.getElementById("f-public").innerHTML = `<option value="">Tous les publics</option>` +
    Object.keys(pubs).map(k => `<option value="${esc(k)}">${esc(k)} (${pubs[k]})</option>`).join("");
  const coms = {}; P.forEach(p => p.communes.forEach(c => coms[c] = (coms[c] || 0) + 1));
  document.getElementById("f-commune").innerHTML = `<option value="">Toutes les communes</option>` +
    Object.keys(coms).sort((a, b) => a.localeCompare(b, "fr")).map(k => `<option value="${esc(k)}">${esc(k)} (${coms[k]})</option>`).join("");
  const nC = Object.keys(coms).length;
  document.getElementById("lede").innerHTML = `<b>${P.length}</b> diététiciens et diététiciennes adhérents, présents dans <b>${nC}</b> communes de l'île. Cherchez par commune, par public ou par domaine d'accompagnement, puis ouvrez la fiche pour prendre contact.`;
}

// --- Rendu des éléments ---
const initials = p => (p.prenom[0] || "") + (p.nom[0] || "");
const avatar = (p, cls) => p.photo ? `<img class="${cls}" src="${p.photo}" alt="">` : `<div class="${cls}" aria-hidden="true">${esc(initials(p))}</div>`;
const modeBadges = p => p.modalites.map(m => `<span class="b ${m === "Visio" ? "visio" : ""}">${{ Cabinet: "Cabinet", Visio: "Visio", Domicile: "Domicile" }[m]}</span>`).join("");
const card = p => `<button class="card" data-id="${p.id}">${avatar(p, "avatar")}<div style="min-width:0">
  <div class="who">${esc(fullName(p))}</div>
  <div class="meta">${esc(p.structure || p.communes.join(", "))}</div>
  ${p.pitch ? `<div class="pitch">${esc(p.pitch)}</div>` : ""}
  <div class="badges">${modeBadges(p)}</div></div></button>`;

// --- Carte ---
let map, geoLayer, pinLayer;
function initMap() {
  map = L.map("map", { zoomSnap: 0.25, minZoom: 9, maxZoom: 14, attributionControl: true, scrollWheelZoom: false });
  geoLayer = L.geoJSON(GEO, { style: () => ({}), onEachFeature: (f, l) => l.on("click", () => selectCommune(f.properties.nom)) }).addTo(map);
  map.fitBounds(geoLayer.getBounds(), { padding: [10, 10] });
  map.setMaxBounds(geoLayer.getBounds().pad(0.4));
  pinLayer = L.layerGroup().addTo(map);
  map.attributionControl.setPrefix(false).addAttribution("IGN Admin Express");
  // Fond OpenStreetMap si l'hébergement l'autorise (bloqué dans l'aperçu, actif sur le site en ligne)
  const probe = new Image();
  probe.onload = () => {
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map).bringToBack();
    document.body.classList.add("osm"); styleMap();
  };
  probe.src = "https://tile.openstreetmap.org/10/747/564.png";
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function styleMap() {
  const counts = {};
  P.filter(p => matches(p, true)).forEach(p => p.communes.forEach(c => counts[c] = (counts[c] || 0) + 1));
  const osm = document.body.classList.contains("osm");
  geoLayer.setStyle(f => {
    const n = counts[f.properties.nom] || 0, on = st.commune === f.properties.nom;
    return { color: on ? cssVar("--primary") : cssVar("--land-edge"), weight: on ? 2.5 : 1.2,
      fillColor: n ? cssVar("--primary") : cssVar("--land"),
      fillOpacity: osm ? (n ? 0.12 + Math.min(n, 5) * 0.05 : 0.04) : (n ? 0.16 + Math.min(n, 5) * 0.09 : 1) };
  });
  pinLayer.clearLayers();
  for (const [c, n] of Object.entries(counts)) {
    const ll = BOURGS[c]; if (!ll) continue;
    const m = L.marker(ll, { icon: L.divIcon({ className: "", html: `<div class="pin ${st.commune === c ? "on" : ""}">${n}</div>`, iconSize: [34, 34], iconAnchor: [17, 17] }), title: `${c} : ${n}`, keyboard: true });
    m.bindTooltip(c, { direction: "top", offset: [0, -16], className: "lbl" });
    m.on("click", () => selectCommune(c));
    pinLayer.addLayer(m);
  }
}
function selectCommune(c) {
  st.commune = st.commune === c ? "" : c;
  document.getElementById("f-commune").value = st.commune;
  render();
}

// --- Vues ---
function renderSide(list) {
  const visio = list.filter(p => p.modalites.includes("Visio") && st.commune && !p.communes.includes(st.commune));
  const here = st.commune ? list.filter(p => p.communes.includes(st.commune)) : list;
  let h = `<div class="side-head"><h2>${st.commune ? esc(st.commune) : "Toute l'île"}</h2>${st.commune ? `<button class="reset" data-clear-commune>Voir toute l'île</button>` : ""}</div>`;
  if (!st.commune) h += `<div class="note">Touchez une commune ou une pastille sur la carte pour voir les diététiciens qui y consultent.</div>`;
  h += here.length ? here.map(card).join("") : `<div class="empty">Aucun diététicien ne correspond à ces critères ici.</div>`;
  if (visio.length) h += `<div class="note" style="margin-top:6px"><b>${visio.length}</b> autre${visio.length > 1 ? "s" : ""} diététicien${visio.length > 1 ? "s" : ""} correspondant à vos critères consulte${visio.length > 1 ? "nt" : ""} en visio, partout sur l'île.</div>` + visio.map(card).join("");
  document.getElementById("side").innerHTML = h;
}
function renderCommunes(list) {
  const groups = {};
  list.forEach(p => p.communes.forEach(c => { if (!st.commune || c === st.commune) (groups[c] ||= []).push(p) }));
  const keys = Object.keys(groups).sort((a, b) => a.localeCompare(b, "fr"));
  document.getElementById("v-communes").innerHTML = keys.length ? keys.map(c => `<section class="commune"><h2>${esc(c)} <span>${groups[c].length} diététicien${groups[c].length > 1 ? "s" : ""}</span></h2><div class="grid">${groups[c].map(card).join("")}</div></section>`).join("")
    : `<div class="empty">Aucun diététicien ne correspond à ces critères.</div>`;
}
function renderTrombi(list) {
  document.getElementById("v-trombi").innerHTML = list.length ? list.map(p => `<button class="face" data-id="${p.id}">${avatar(p, "ph")}<div><div class="who">${esc(fullName(p))}</div><div class="meta">${esc(p.communes.join(" · "))}</div></div></button>`).join("")
    : `<div class="empty" style="grid-column:1/-1">Aucun diététicien ne correspond à ces critères.</div>`;
}
function render() {
  const list = P.filter(p => matches(p));
  const active = st.q || st.domaine || st.public || st.commune || st.modes.size;
  document.getElementById("count").textContent = `${list.length} sur ${P.length} affiché${list.length > 1 ? "s" : ""}`;
  document.getElementById("reset").hidden = !active;
  for (const v of ["carte", "communes", "trombi"]) {
    document.getElementById("v-" + v).hidden = st.view !== v;
    document.getElementById("t-" + v).setAttribute("aria-selected", st.view === v);
  }
  if (st.view === "carte") { renderSide(P.filter(p => matches(p, true))); styleMap(); setTimeout(() => map.invalidateSize(), 0) }
  if (st.view === "communes") renderCommunes(list);
  if (st.view === "trombi") renderTrombi(list);
}

// --- Fiche ---
const ICONS = { rdv: "Prendre rendez-vous", site: "Site internet", instagram: "Instagram", facebook: "Facebook", linkedin: "LinkedIn" };
function openFiche(id, push = true) {
  const p = byId[id]; if (!p) return;
  const links = ["rdv", "site", "instagram", "facebook", "linkedin"].filter(k => p.liens[k])
    .map(k => `<a class="btn ${k === "rdv" ? "main" : ""}" href="${esc(p.liens[k])}" target="_blank" rel="noopener">${ICONS[k]} ↗</a>`).join("");
  const dom = Object.entries(p.domaines).map(([cat, tags]) => `<h4>${esc(cat)}</h4><div class="tags">${tags.map(t => `<span class="tag ${t === st.domaine ? "hit" : ""}">${esc(t)}</span>`).join("")}</div>`).join("");
  const sec = (t, body) => body ? `<section class="sec"><h3>${t}</h3>${body}</section>` : "";
  const tagList = arr => arr.length ? `<div class="tags">${arr.map(t => `<span class="tag ${t === st.public ? "hit" : ""}">${esc(t)}</span>`).join("")}</div>` : "";
  const modes = { Cabinet: "au cabinet", Visio: "en visio", Domicile: "à domicile" };
  document.getElementById("sheet").innerHTML = `
    <div class="close"><button id="close">Fermer ✕</button></div>
    <div class="sheet-in">
      <div class="id">${avatar(p, "ph")}<div style="min-width:0">
        <h2 id="sheet-name">${esc(fullName(p))}</h2>
        ${p.structure ? `<div class="struct">${esc(p.structure)}</div>` : ""}
        <div class="where">${esc(p.communes.join(" · "))}</div>
        <div class="badges" style="margin-top:8px">${p.modalites.map(m => `<span class="b ${m === "Visio" ? "visio" : ""}">Consulte ${modes[m]}</span>`).join("")}</div>
      </div></div>
      ${p.pitch ? `<blockquote>${esc(p.pitch)}</blockquote>` : ""}
      <div class="contact">
        ${p.tel ? `<div class="line"><span class="lbl">Téléphone</span><a class="val" href="tel:${p.tel.replace(/\s/g, "")}">${esc(p.tel)}</a><button class="copy" data-copy="${esc(p.tel)}">Copier</button></div>` : ""}
        ${p.email ? `<div class="line"><span class="lbl">Email</span><a class="val" href="mailto:${esc(p.email)}">${esc(p.email)}</a><button class="copy" data-copy="${esc(p.email)}">Copier</button></div>` : ""}
        ${links ? `<div class="links">${links}</div>` : ""}
      </div>
      ${sec("Publics accompagnés", tagList(p.publics))}
      ${sec("Domaines d'accompagnement", dom)}
      ${sec("Approche", p.approches.length ? `<div class="appr">${p.approches.map(a => `<div><b>${esc(a)}</b><span>${esc(DATA.approchesDesc[a] || "")}</span></div>`).join("")}</div>` : "")}
      ${sec("Méthodes et outils", tagList(p.outils))}
      ${sec("Autres prestations", tagList(p.prestations))}
      ${sec("Formations", p.formations.length ? `<ul class="forms">${p.formations.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : "")}
      ${p.rpps ? `<div class="rpps">N° ${p.rppsType} : ${esc(p.rpps)}</div>` : ""}
    </div>`;
  const ov = document.getElementById("overlay");
  ov.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("sheet").scrollTop = 0;
  document.getElementById("close").focus();
  if (push) history.replaceState(null, "", "#" + id);
}
function closeFiche() {
  document.getElementById("overlay").hidden = true; document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
}

// --- Événements ---
document.addEventListener("click", e => {
  const c = e.target.closest("[data-id]"); if (c) return openFiche(c.dataset.id);
  if (e.target.closest("[data-clear-commune]")) return selectCommune(st.commune);
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const done = () => { cp.textContent = "Copié"; setTimeout(() => cp.textContent = "Copier", 1500) };
    try { navigator.clipboard.writeText(cp.dataset.copy).then(done, () => selectNext(cp)) } catch (err) { selectNext(cp) }
    return;
  }
  if (e.target.id === "close" || e.target.id === "overlay") closeFiche();
});
function selectNext(btn) { const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r) }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("overlay").hidden) closeFiche() });
document.getElementById("q").addEventListener("input", e => { st.q = e.target.value.trim(); render() });
for (const [id, k] of [["f-domaine", "domaine"], ["f-public", "public"], ["f-commune", "commune"]])
  document.getElementById(id).addEventListener("change", e => { st[k] = e.target.value; render() });
document.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
  const m = b.dataset.m; st.modes.has(m) ? st.modes.delete(m) : st.modes.add(m);
  b.setAttribute("aria-pressed", st.modes.has(m)); render();
}));
document.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
  st.view = b.dataset.v; try { localStorage.setItem("annuaire-vue", st.view) } catch (e) {} render();
}));
document.getElementById("reset").addEventListener("click", () => {
  Object.assign(st, { q: "", domaine: "", public: "", commune: "" }); st.modes.clear();
  ["q", "f-domaine", "f-public", "f-commune"].forEach(id => document.getElementById(id).value = "");
  document.querySelectorAll("[data-m]").forEach(b => b.setAttribute("aria-pressed", "false")); render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => styleMap());
new MutationObserver(() => styleMap()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

fillSelects(); initMap(); render();
if (location.hash.length > 1 && byId[location.hash.slice(1)]) openFiche(location.hash.slice(1), false);
</script>
</body>
</html>
